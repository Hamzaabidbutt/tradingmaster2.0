services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    restart: "no"
    command:
      - mongosh
      - --host
      - mongo:27017
      - --quiet
      - --eval
      - "try { rs.status() } catch (error) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }"
    depends_on:
      mongo:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: worker
    command: sh -c "npx prisma db push && npx tsx prisma/seed.ts"
    environment:
      DATABASE_URL: mongodb://mongo:27017/tradingmaster?replicaSet=rs0
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mongodb://mongo:27017/tradingmaster?replicaSet=rs0
      AUTH_SECRET: ${AUTH_SECRET:-please-change-me-in-production}
      SIGNAL_MIN_CONFIDENCE: "65"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: mongodb://mongo:27017/tradingmaster?replicaSet=rs0
      WORKER_INTERVAL_SEC: "60"
      SIGNAL_MIN_CONFIDENCE: "65"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mongo-data:
